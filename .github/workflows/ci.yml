name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Test coordination triage scripts
        run: python -B -I -m unittest discover -s scripts -p 'test_coordination_triage.py' -v
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Fail closed: the new GPU regressions must execute on D3D12 WARP,
      # not silently return because the hosted runner has no hardware adapter.
      - name: WARP tracked texture row regressions
        env:
          VICTORY_D3D12_WARP: "1"
          VICTORY_D3D12_DEBUG: "1"
        run: |
          $single = cargo test -p victory-gpu --features diagnostics --lib draw::tests::a_write_into_one_page_uploads_its_rows_alone --locked -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@($single | Select-String -SimpleMatch "draw::tests::a_write_into_one_page_uploads_its_rows_alone: test").Count -ne 1) { throw "Expected exactly one fully tracked row regression test" }
          $singleRun = cargo test -p victory-gpu --features diagnostics --lib draw::tests::a_write_into_one_page_uploads_its_rows_alone --locked -- --exact --nocapture --test-threads=1 2>&1
          $singleRun | Write-Output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($singleRun -match "WARP host device created")) { throw "The fully tracked row test did not confirm WARP host creation" }
          $mixed = cargo test -p victory-gpu --features diagnostics --lib draw::tests::tracked_rows --locked -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@($mixed | Select-String -SimpleMatch "draw::tests::tracked_rows::").Count -ne 2) { throw "Expected exactly two mixed/untracked row regression tests" }
          $mixedRun = cargo test -p victory-gpu --features diagnostics --lib draw::tests::tracked_rows --locked -- --nocapture --test-threads=1 2>&1
          $mixedRun | Write-Output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@($mixedRun | Select-String -SimpleMatch "WARP host device created").Count -ne 2) { throw "Expected both mixed/untracked row tests to confirm WARP host creation" }
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        run: cargo test --workspace --locked

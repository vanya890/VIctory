name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Test coordination triage scripts
        run: python -B -I -m unittest discover -s scripts -p 'test_coordination_triage.py' -v
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        run: cargo test --workspace --locked
      # Force the generic texture descriptor path through the software D3D12 adapter.
      # The test fails closed if WARP cannot be initialized.
      - name: D3D12 WARP texture SRV/UAV regression
        run: cargo test -p victory-gpu --features diagnostics --lib --locked texture_views_with_invalid_dimensions_ranges_or_mapping_fall_back_to_null -- --nocapture
        env:
          VICTORY_D3D12_WARP: "1"

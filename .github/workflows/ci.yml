name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Test coordination triage scripts
        run: python -B -I -m unittest discover -s scripts -p 'test_coordination_triage.py' -v
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        run: cargo test --workspace --locked

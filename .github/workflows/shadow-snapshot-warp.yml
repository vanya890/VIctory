name: Shadow snapshot WARP

on:
  pull_request:
    branches: [dev]
    paths:
      - "crates/victory-gpu/src/shadow.rs"
      - ".github/workflows/shadow-snapshot-warp.yml"
  push:
    branches: [dev]
    paths:
      - "crates/victory-gpu/src/shadow.rs"
      - ".github/workflows/shadow-snapshot-warp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadow-snapshot-warp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  snapshot-copy-back:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Fragmented snapshot copy-back under WARP, Debug Layer and GBV
        env:
          VICTORY_D3D12_WARP: "1"
          VICTORY_D3D12_DEBUG: "1"
          VICTORY_D3D12_GBV: "1"
        run: cargo test -p victory-gpu --features diagnostics --locked --lib shadow::tests::snapshots_cover_the_declared_ranges_and_writes_go_back_once -- --exact --nocapture --test-threads=1

name: Format D3D12 fence change

on:
  push:
    branches: [agent/d3d12-fence-completion-86]

permissions:
  contents: write

concurrency:
  group: format-d3d12-fence-86
  cancel-in-progress: false

jobs:
  format:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Format workspace
        run: cargo fmt --all
      - name: Commit rustfmt changes
        shell: pwsh
        run: |
          if (git status --porcelain) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style: format host submission completion"
            git push origin HEAD
          } else {
            Write-Host "Workspace already formatted."
          }
